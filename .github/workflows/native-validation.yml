name: Validate native ports (no publishing)
on:
  workflow_dispatch:
    inputs:
      revision:
        description: Source branch to validate
        required: true
        default: codex/cross-platform
permissions:
  contents: read
jobs:
  windows-x64:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.revision }}
      - name: Unpack native candidate
        run: python -m zipfile -e ports/native-candidate.zip native
      - name: Shared work-mode scenarios (MSVC)
        shell: cmd
        run: |
          for /f "usebackq tokens=*" %%i in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property installationPath`) do call "%%i\VC\Auxiliary\Build\vcvars64.bat"
          cl /nologo /std:c++17 /EHsc /W4 native\tests\cross-platform\work_model.cpp /Fe:work-model.exe
          if errorlevel 1 exit /b 1
          work-model.exe
          cl /nologo /std:c++17 /EHsc /utf-8 native\tests\cross-platform\sources.cpp /Fe:sources.exe /link winhttp.lib
          if errorlevel 1 exit /b 1
          sources.exe
          cl /nologo /std:c++17 /EHsc /utf-8 native\tests\cross-platform\hooks.cpp /Fe:hooks.exe /link winhttp.lib
          if errorlevel 1 exit /b 1
          hooks.exe "%RUNNER_TEMP%\kurocat-hooks"
      - name: Native build (Windows 7 SP1 API baseline)
        shell: cmd
        run: |
          for /f "usebackq tokens=*" %%i in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property installationPath`) do call "%%i\VC\Auxiliary\Build\vcvars64.bat"
          call native\windows\build.bat
      - name: Native GUI startup and work-mode smoke test
        shell: pwsh
        run: |
          $petProcess = Start-Process -FilePath "$PWD/native/windows/KuroCatWork.exe" -ArgumentList "--smoke-test" -PassThru
          if (-not $petProcess.WaitForExit(15000)) { $petProcess.Kill(); throw 'Native UI did not close cleanly' }
          if ($petProcess.ExitCode -ne 0) { throw "Native UI failed: $($petProcess.ExitCode)" }
      - name: Native visual snapshots
        shell: cmd
        run: |
          for /f "usebackq tokens=*" %%i in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property installationPath`) do call "%%i\VC\Auxiliary\Build\vcvars64.bat"
          cl /nologo /std:c++17 /EHsc /utf-8 native\tests\cross-platform\render.cpp /Fe:render.exe /link gdiplus.lib user32.lib gdi32.lib ole32.lib
          if errorlevel 1 exit /b 1
          render.exe
      - name: Package Windows portable release
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force release/KuroCatWork/Resources | Out-Null
          Copy-Item native/windows/KuroCatWork.exe release/KuroCatWork/
          Copy-Item native/Resources/WorkSounds release/KuroCatWork/Resources/ -Recurse
          Copy-Item native/LICENSE release/KuroCatWork/
          Compress-Archive -Path release/KuroCatWork -DestinationPath KuroCatWork-Windows-x64.zip
          Get-FileHash KuroCatWork-Windows-x64.zip -Algorithm SHA256
      - uses: actions/upload-artifact@v4
        with:
          name: Windows-x64-validation-only
          path: |
            native/windows/KuroCatWork.exe
            cat-*.png
            KuroCatWork-Windows-x64.zip
  linux:
    strategy:
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: x86_64
          - runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.revision }}
      - name: Unpack native candidate
        run: python -m zipfile -e ports/native-candidate.zip native
      - name: Build against glibc 2.28 (Debian 10)
        shell: bash
        run: |
          docker run --rm -v "$PWD":/src -w /src/native -e KUROCAT_MAX_GLIBC=2.28 debian:buster bash -euo pipefail -c '
            sed -i -e "s|deb.debian.org|archive.debian.org|g" \
                   -e "s|security.debian.org|archive.debian.org|g" \
                   -e "/buster-updates/d" /etc/apt/sources.list
            apt-get -o Acquire::Check-Valid-Until=false update
            apt-get install -y --no-install-recommends g++ pkg-config libgtk-3-dev libcairo2-dev libx11-dev libxi-dev xvfb xauth
            g++ -std=c++17 -Wall -Wextra -Werror tests/cross-platform/work_model.cpp -o /tmp/work-model
            /tmp/work-model
            g++ -std=c++17 -Wall -Wextra -Werror tests/cross-platform/sources.cpp -o /tmp/sources -lstdc++fs -lpthread
            /tmp/sources
            g++ -std=c++17 -Wall -Wextra -Werror tests/cross-platform/hooks.cpp -o /tmp/hooks -lstdc++fs -lpthread
            /tmp/hooks /tmp/kurocat-hooks
            bash linux/build.sh
            timeout 15s xvfb-run -a linux/kurocatwork --smoke-test
            g++ -std=c++17 -O2 tests/cross-platform/render.cpp -o /tmp/render $(pkg-config --cflags --libs gtk+-3.0 cairo x11 xi) -lpthread -lstdc++fs
            /tmp/render
            bash linux/build_deb.sh 1.4.5
          '
      - name: Package Linux portable release
        shell: bash
        run: |
          mkdir -p release/KuroCatWork/Resources
          cp native/linux/kurocatwork native/linux/install.sh native/linux/uninstall.sh native/linux/kurocatwork.desktop native/linux/kurocatwork.png native/LICENSE release/KuroCatWork/
          cp -R native/Resources/WorkSounds release/KuroCatWork/Resources/
          tar -C release -czf KuroCatWork-Linux-${{ matrix.arch }}.tar.gz KuroCatWork
          sha256sum KuroCatWork-Linux-${{ matrix.arch }}.tar.gz native/linux/*.deb
      - uses: actions/upload-artifact@v4
        with:
          name: Linux-${{ matrix.arch }}-validation-only
          path: |
            native/linux/kurocatwork
            native/cat-*.png
            native/linux/*.deb
            KuroCatWork-Linux-*.tar.gz
